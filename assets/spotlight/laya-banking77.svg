<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 468" role="img" aria-labelledby="title description">
  <title id="title">Laya (Jev) vs Cross Encoder on BANKING77</title>
  <desc id="description">On 320 held-out requests, fine-tuned Laya reached 90.6 percent accuracy at 98.8 milliseconds per request, ModernBERT-base CrossEncoder reached 89.7 percent at 76.3 milliseconds, and ModernBERT-large CrossEncoder reached 93.4 percent at 208.0 milliseconds. CPU, batch size four.</desc>
  <rect width="1000" height="468" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="466" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="40" y="43" fill="#7ee787" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">EXPERIMENT SPOTLIGHT / NLP</text>
  <text x="40" y="91" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Laya (Jev) vs Cross Encoder</text>
  <text x="40" y="122" fill="#aab5c2" font-family="Arial, Helvetica, sans-serif" font-size="17">8 related BANKING77 intents  ·  320 held-out requests  ·  CPU, batch size 4</text>
  <rect x="843" y="35" width="116" height="29" rx="14.5" fill="#173224" stroke="#2b6f43"/>
  <text x="901" y="54" text-anchor="middle" fill="#7ee787" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">VIEW RESULTS ↗</text>
  <line x1="40" y1="148" x2="960" y2="148" stroke="#30363d"/>

  <rect x="40" y="172" width="440" height="248" rx="15" fill="#161b22" stroke="#30363d"/>
  <rect x="500" y="172" width="460" height="248" rx="15" fill="#161b22" stroke="#30363d"/>

  <text x="62" y="207" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Accuracy</text>
  <text x="452" y="206" text-anchor="end" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="13">higher is better</text>
  <text x="522" y="207" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Inference time</text>
  <text x="938" y="206" text-anchor="end" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="13">ms/request · lower is better</text>

  <text x="62" y="245" fill="#dbe7f2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Laya fine-tuned</text>
  <text x="452" y="245" text-anchor="end" fill="#79c0ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">90.6%</text>
  <rect x="62" y="256" width="390" height="12" rx="6" fill="#30363d"/>
  <rect x="62" y="256" width="353.3" height="12" rx="6" fill="#58a6ff"/>
  <text x="522" y="245" fill="#dbe7f2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Laya fine-tuned</text>
  <text x="938" y="245" text-anchor="end" fill="#79c0ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">98.8 ms</text>
  <rect x="522" y="256" width="390" height="12" rx="6" fill="#30363d"/>
  <rect x="522" y="256" width="160.6" height="12" rx="6" fill="#58a6ff"/>

  <text x="62" y="307" fill="#dbe7f2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">CrossEncoder · base</text>
  <text x="452" y="307" text-anchor="end" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">89.7%</text>
  <rect x="62" y="318" width="390" height="12" rx="6" fill="#30363d"/>
  <rect x="62" y="318" width="349.8" height="12" rx="6" fill="#8b949e"/>
  <text x="522" y="307" fill="#dbe7f2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">CrossEncoder · base</text>
  <text x="938" y="307" text-anchor="end" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">76.3 ms</text>
  <rect x="522" y="318" width="390" height="12" rx="6" fill="#30363d"/>
  <rect x="522" y="318" width="124.0" height="12" rx="6" fill="#8b949e"/>

  <text x="62" y="369" fill="#dbe7f2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">CrossEncoder · large</text>
  <text x="452" y="369" text-anchor="end" fill="#7ee787" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">93.4%</text>
  <rect x="62" y="380" width="390" height="12" rx="6" fill="#30363d"/>
  <rect x="62" y="380" width="364.3" height="12" rx="6" fill="#3fb950"/>
  <text x="522" y="369" fill="#dbe7f2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">CrossEncoder · large</text>
  <text x="938" y="369" text-anchor="end" fill="#7ee787" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">208.0 ms</text>
  <rect x="522" y="380" width="390" height="12" rx="6" fill="#30363d"/>
  <rect x="522" y="380" width="338.0" height="12" rx="6" fill="#3fb950"/>

  <text x="62" y="408" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="11">0%</text>
  <text x="452" y="408" text-anchor="end" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="11">100%</text>
  <text x="522" y="408" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="11">0 ms</text>
  <text x="912" y="408" text-anchor="end" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="11">240 ms</text>

  <text x="40" y="451" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="13">One held-out test split · Laya reads 1 eight-option sequence; each CrossEncoder scores 8 request–option pairs.</text>
</svg>
