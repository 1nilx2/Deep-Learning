<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100f14"><meta name="description" content="An interactive Study or Lab dossier from Deep Learning Fieldnotes."><title>GR2 — Fieldnotes</title><link rel="stylesheet" href="../../study.css"><script id="study-data" type="application/json">{"id":"gr2","name":"GR2","eyebrow":"META AI · SEMANTIC IDS · REASONING · RE-RANKING","hero":["Learn to reason.","Learn to rerank."],"emphasis":"rerank.","intro":"From the language of items to the reward for ranking.\nSeven scenes following a personal reading map.","accent":"#b8cbb6","paper":"https://arxiv.org/abs/2602.07774v6","notesPath":"paper/gr2/README.md","notesFile":"GR2_notes.md","version":"arXiv:2602.07774v6 · 23 June 2026","figure":"gr2-overview.svg","figureAlt":"GR2: SID alignment, reasoning distillation, and conditional ranking rewards","next":"spd","nextTitle":"Next: what if ranking needed no reasoning generation?","lang":"en","chapters":[{"tag":"01 / THE QUESTION","title":"A fixed list.\nA better order.","subtitle":"The candidates are selected. In what order should they appear?","paragraphs":["GR2 reads a purchase history and a candidate list already ordered by a retriever. It generates a new order that aims to move the next purchased item upward. The paper uses ten candidates in its reranking experiments.","The starting question is: how can LLM reasoning help refine the final recommendation order? Follow item representation, teacher-generated training data, and rewards for actual ranking improvements as one connected pipeline."],"note":"The observed next purchase supplies the training label and evaluation signal. The future answer is not provided as a serving-time input.","lab":"gr2-overview"},{"tag":"02 / TOKENIZED MID-TRAINING","title":"Identify each item.\nPreserve its meaning.","subtitle":"Names → IDs → token fragments. Why move to Semantic IDs?","paragraphs":["To recommend with an LLM, first decide how to represent products. A model may already know that someone who bought shampoo could need conditioner. But a real recommendation must go beyond naming a product category: the model must read which shampoo was purchased, compare the particular conditioners in the candidate list, and refer to a specific item.","Product names alone can leave that reference ambiguous. If a model says “shampoo,” we know the kind of product, but not which of the many shampoos in a catalog it means. Descriptions convey meaning; the recommender also needs a consistent way to distinguish individual items.","What about ordinary item IDs? “84721” and “19306” can identify two products precisely, but the numbers do not tell us whether both are shampoos or entirely different objects. If every item ID is also registered as its own new LLM token, the item vocabulary and embedding table grow with millions or billions of products.","One could split ID strings with a general tokenizer such as BPE and reuse existing token fragments. Yet a fragment of “84721” is just part of an arbitrary identifier. Two IDs sharing “84” need not describe similar products. This is the central question in the reading map: can we represent product meaning without assigning a separate new token to every item?","Semantic IDs address that question by representing each item as a combination of short codes chosen across several levels. Similar items can share some codes, while the complete combination helps distinguish individual products. The number of possible combinations multiplies across levels even when each level has a limited code vocabulary.","A broad-to-fine classification is a useful intuition, but these are not hand-written labels such as beauty → hair care → shampoo. GR2 learns codes from product text features with RQ-VAE. Earlier levels approximate the representation, and later levels account for residual differences. The paper also randomizes the last levels to improve distinguishability, so not every code is an interpretable category.","Creating the codes does not mean a pretrained LLM already understands them. The model therefore receives further training on examples connecting SIDs with product descriptions, categories, and user interactions. Next-token prediction over codes and natural language teaches their relationships. This is tokenized mid-training: establish a language for handling items before teaching the model to reason about them."],"note":"The name, ID, and BPE comparison explains the reading map; it is not a direct three-way experiment reported in the paper. Products, code assignments, and capacity counts are illustrative. A large code space does not guarantee collision-free SIDs.","lab":"gr2-sid","plate":{"titleLines":["Identify each item.","Preserve its meaning."],"problems":[["Use product names alone?","“Shampoo” does not identify one particular product."],["Register every item ID as a new token?","Precise identity, but vocabulary grows with the catalog."],["Split IDs with BPE?","Shared number fragments do not imply similar products."]],"solution":"SID: combine codes that reflect item meaning.","examples":[["Shampoo A","[3, 7, 2]"],["Shampoo B","[3, 7, 9]"]],"analogy":"Think broad to fine, but learn the codes rather than hand-label them.","alignment":["Train on these SIDs together with product descriptions.","The LLM learns their relationships: tokenized mid-training."]}},{"tag":"03 / REASONING DATA + SFT","title":"Distill the reasoning.\nKeep correct predictions.","subtitle":"Distillation: teacher generation → verification → selection → student SFT","paragraphs":["The goal is distillation: teach a student model from a larger teacher. Give the teacher a purchase history and recommendation candidates, then ask it to generate both reasoning and a predicted ranking. Do not reveal the actual next purchased item in that input.","After generation, compare the predicted item with the observed next purchase. Discard incorrect outputs and sample again. Retain the reasoning and ranking from correct predictions as student SFT data. This selection procedure is rejection sampling.","The alternative, targeted sampling, reveals the answer first and asks the teacher to explain why it should be selected. This can reduce the need to retry until the prediction is correct, but the teacher has not independently reached that answer. It may rationalize the supplied label and invent supporting evidence.","The student is then fine-tuned to generate both the selected explanation and final ranking. System and user tokens are excluded from the loss. Reasoning and ranking segments of the assistant response receive different weights, with more weight on ranking tokens (λr \u003c λo). Expand “Student SFT” for the loss illustration."],"note":"In rejection sampling, the ground truth is used for external verification, not as a teacher input. A correct prediction does not guarantee a factual explanation. The potential cost advantage of targeted sampling follows from fewer retries; it is not a measured cost reduction reported here.","lab":"gr2-traces","plate":{"titleLines":["Distill the reasoning.","Keep correct predictions."],"mainLabel":"REJECTION SAMPLING · PREDICT FIRST, THEN CHECK","input":["History + candidates","Ground truth withheld"],"teacher":["Teacher generates","Reasoning + predicted ranking"],"verification":"Predicted item = ground truth?","reject":["Wrong → discard and retry","Do not train on this response."],"accept":["Correct → retain for training","Reasoning + ranking → student SFT"],"verificationNote":"Use ground truth only to check the generated prediction externally.","alternative":["ALTERNATIVE · TARGETED SAMPLING","Give the answer first → generate a rationale for it.","Fewer retries may reduce cost,","but label-driven rationalization can hallucinate evidence."]}},{"tag":"04 / RL · REWARD DESIGN","title":"Reward the move.\nNot just the format.","subtitle":"Do not make copying the input order a shortcut to reward.","paragraphs":["The ranking reward is (target rank before − target rank after) / candidate count. Moving the target up earns a positive reward; preserving its rank earns zero; moving it down earns a negative reward. The format reward checks whether reasoning and a ranking can be extracted.","Adding the two rewards unconditionally can let the model copy the input order and collect a format bonus. Equation (15) grants that bonus only when the target moves up or was originally ranked first. The explorer also shows the initially-first exception."],"note":"The explicit reward uses target-rank improvement and format checks, rather than a separately trained reward model or AUC/NDCG score. Format checks do not directly establish that the reasoning is true.","lab":"gr2-reward"},{"tag":"05 / RL · DAPO","title":"Sample a group.\nCompare the rewards.","subtitle":"Learn from the relative quality of several generated responses.","paragraphs":["Sample several responses for the same prompt and compute their ranking and format rewards. Normalize each reward by the group mean and standard deviation to obtain an advantage for policy optimization.","DAPO uses separate upper and lower clipping bounds, a token-level objective, and dynamic sampling to retain useful learning signals. If every response receives the same reward, the group offers no relative advantage signal."],"note":"The group size of four and standard-deviation convention are illustrative. This explorer does not reproduce DAPO clipping, dynamic sampling, or policy updates.","lab":"gr2-group"},{"tag":"06 / REPORTED RESULTS","title":"A gain needs\na denominator.","subtitle":"Read the Beauty improvement alongside the smaller Sports changes.","paragraphs":["In Beauty Table 5, RL-rejection-KP changes Recall@5 from 0.7227 to 0.7460 and NDCG@5 from 0.5101 to 0.5234 versus Pre-rank. These are gains of 2.33 and 1.33 points, or approximately 3.22% and 2.61% relative.","In Sports Table 6, the same method does not improve Recall@5 (0.7077 → 0.7077). RL-targeted-KP also produces only small changes. Results depend on the dataset and method; reasoning-aware SFT alone does not guarantee a ranking gain."],"note":"Do not directly compare Table 4 retrieval scores with Tables 5–6 reranking scores. Do not present the abstract’s improvement figures as universal relative gains.","lab":"gr2-results"},{"tag":"07 / THE READING MAP","title":"Keep the pipeline.\nSharpen the details.","subtitle":"Connect the reading-map intuition to the paper’s definitions.","paragraphs":["The main thread is unchanged: learn item representations, select teacher reasoning to teach the student, then reward better rankings. Keep the construction of SIDs, the token-level SFT loss, and the RL reward definition distinct.","GR2 generates an explanation and ranking autoregressively. That output path differs from SPD’s single-pass item–position assignment and GenRec’s prefill-only scoring. Reasoning generation has a computational cost, and reranking remains limited by the retrieved candidates."],"note":"Based on the supplied arXiv:2602.07774v6 and a personal handwritten reading map. Where Figure 1 and the explicit reward formulation differ in detail, these explorers follow Sections 4.2–4.3.","lab":"gr2-map"}]}</script><script src="../../study.js" defer></script></head><body><div id="study-root"></div><noscript><main style="padding:8%;color:#ddd;background:#100f14;font-family:system-ui"><h1>GR2</h1><p>Enable JavaScript for the interactive study, or read the complete notes.</p><a href="https://github.com/1nilx2/Deep-Learning/blob/main/paper/gr2/README.md">Read the GitHub notes</a> · <a href="../../">Fieldnotes</a></main></noscript></body></html>
