<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100f14"><meta name="description" content="An interactive, eight-chapter paper study from Deep Learning Fieldnotes."><title>Artwork Personalization — Fieldnotes</title><link rel="stylesheet" href="../../study.css"><script id="study-data" type="application/json">{"id":"artwork","name":"Artwork Personalization","eyebrow":"NETFLIX · LLM POST-TRAINING · PERSONALIZATION","hero":["One title.","A different first impression."],"emphasis":"impression.","intro":"The same story. A different visual cue.\nEight cards from captions to preference learning.","accent":"#d6b5d0","paper":"https://arxiv.org/abs/2601.02764v1","notesPath":"paper/netflix-artwork-personalization/README.md","notesFile":"Artwork_notes.md","version":"arXiv:2601.02764v1 · Sections 4–5","figure":"artwork-pipeline.svg","figureAlt":"Artwork personalization: inputs, SFT, optional DPO, and evaluation","next":"genrec","nextTitle":"Step back: which title should rank first?","chapters":[{"tag":"01 / THE QUESTION","title":"Same title.\nDifferent ways in.","subtitle":"Personalize the image, not the title.","paragraphs":["A title has already been selected. Its candidate artworks may emphasize suspense, relationships, or adventure. The task is to choose which image to show a particular viewer.","The model combines viewing history, information about the title, candidate artwork captions, and task instructions. It selects from supplied artworks; it does not generate a new poster."],"note":"The fictional title and viewer profiles are a teaching example. Selections below are hand-authored to illustrate the task, not predictions by Netflix or an LLM.","lab":"art-choice"},{"tag":"02 / FROM PIXELS TO WORDS","title":"Let the image\nenter the prompt.","subtitle":"A visual language model supplies captions.","paragraphs":["A VLM first describes visual cues such as facial expressions, character composition, and colors. Those captions let a text LLM process artwork information together with viewing preferences.","The image-to-caption step is separate from personalization. A useful description says what the artwork shows; the selection model then relates that information to the viewer and title."],"note":"Captions in this explorer are written examples. No image-captioning model runs in the browser.","lab":"art-captions"},{"tag":"03 / THE SHARED INPUT","title":"History. Title.\nCandidate captions.","subtitle":"One prompt connects the evidence.","paragraphs":["The shared input x contains user history, target-title information, candidate captions, and instructions. Each training method uses that context but supplies a different form of supervision.","The teacher receives the known correct artwork and generates an explanation for that label. This adds an explanation target that is missing from ordinary behavioral logs."],"note":"This prompt is illustrative, not an undisclosed production template. Label-conditioned explanations do not reveal a viewer’s actual internal reasons.","lab":"art-prompt"},{"tag":"04 / SUPERVISED FINE-TUNING","title":"Learn to explain.\nThen select.","subtitle":"Reasoning-SFT extends the target response.","paragraphs":["Standard SFT targets the selected caption. Reasoning-SFT targets an explanation followed by that caption. Autoregressive next-token loss teaches the desired output sequence.","LoRA updates adapters while base weights stay frozen. Response-only masking is a general implementation explanation here: the paper does not disclose its exact collator or token-level loss mask."],"note":"Teaching explanation-generation patterns is not evidence that an explanation faithfully identifies the cause of a user’s choice.","lab":"art-sft"},{"tag":"05 / DIRECT PREFERENCE OPTIMIZATION","title":"Prefer one response\nover another.","subtitle":"A relative gap, against a frozen reference.","paragraphs":["DPO uses the same prompt with chosen and rejected responses. In the paper, the chosen artwork is ground truth; an alternative is randomly sampled from the remaining candidates.","The policy learns to favor the chosen response relative to the rejected response compared with a frozen reference. DPO does not require a separate reward model. SFT → DPO is a tested route, not a universal improvement rule."],"note":"A sampled alternative is not an observed dislike. The loss demo shows log-ratio changes, not actual training or guarantees about each response’s absolute probability.","lab":"art-dpo"},{"tag":"06 / INFERENCE","title":"Generate a caption.\nMatch a candidate.","subtitle":"Text output becomes an artwork selection.","paragraphs":["The model generates caption text, which is mapped back to a candidate using n-gram matching. It is more specific than simply asking the model to output an artwork index.","The selection still comes from the supplied artwork set. In this explorer, change the generated text to see how a simplified word-bigram matcher can associate it with a candidate—or fail to find a match."],"note":"This teaching matcher is not the paper’s exact decoding implementation. Real generation and matching can have ambiguities that the examples do not cover.","lab":"art-matching"},{"tag":"07 / THE OFFLINE RESULTS","title":"A better signal\nfor a better choice.","subtitle":"Reasoning-SFT leads the reported comparison.","paragraphs":["The paper reports relative IPS changes versus production of +2.45% for SFT, +2.82% for DPO, and +5.21% for Reasoning-SFT. These are offline evaluation results.","They are neither CTR percentage-point gains nor online A/B outcomes. The results do not show that adding DPO after SFT always helps. Negative-example quality remains an important interpretation limit."],"note":"The notes use the IPS improvements shared by Tables 1 and 4; DPO accuracy values differ between those tables.","lab":"art-results"},{"tag":"08 / WHAT TO REMEMBER","title":"A selected image.\nAn explanation to question.","subtitle":"Keep the objective and its evidence separate.","paragraphs":["SFT transfers desirable response patterns. Reasoning-SFT also teaches label-conditioned explanation generation. DPO adjusts relative response preferences against a fixed reference.","The most useful reading separates the supplied visual evidence, the label, the learning objective, and what the offline evaluation establishes. None of these alone proves a viewer’s causal motivation."],"note":"Choosing a title, choosing an artwork, and assigning candidates to ranks are three different tasks. Follow the companion studies to compare their mechanisms.","lab":"art-takeaway"}]}</script><script src="../../study.js" defer></script></head><body><div id="study-root"></div><noscript><main style="padding:8%;color:#ddd;background:#100f14;font-family:system-ui"><h1>Artwork Personalization</h1><p>Enable JavaScript for the interactive study, or read the complete notes.</p><a href="https://github.com/1nilx2/Deep-Learning/blob/main/paper/netflix-artwork-personalization/README.md">Read the GitHub notes</a> · <a href="../../">Fieldnotes</a></main></noscript></body></html>
