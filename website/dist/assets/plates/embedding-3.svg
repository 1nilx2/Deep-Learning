<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">EmbeddingGemma 2 — Look below the average.</title><desc id="desc">These per-child rates describe Exp 1 only. Group size and the alignment assumptions matter.</desc><rect width="1200" height="1140" fill="#dde7e0"/><text x="70" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / EMBEDDINGGEMMA 2</text><text x="1130" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">04</text><path d="M70 99H1130" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Look below the average.</text><text x="72" y="249" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Six children, unequal sample counts.</text><text x="92" y="414" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Group sizes</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >59 / 30 / 60 / 30 / 12 / 30 pairs</text><path d="M160 486H1100" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Direction matters</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Text queries and audio queries differ</text><path d="M160 599H1100" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Small groups</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Rates can be unstable</text><path d="M160 712H1100" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Read the full report</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Per-child values and uncertainty</text><path d="M160 825H1100" stroke="#42685f" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">04 / CHILD-LEVEL VIEW</text><text x="1130" y="1071" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>