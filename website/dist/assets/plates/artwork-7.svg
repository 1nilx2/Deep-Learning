<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Artwork Personalization — A selected image. An explanation to question.</title><desc id="desc">Choosing a title, choosing an artwork, and assigning candidates to ranks are three different tasks. Follow the companion studies to compare their mechanisms.</desc><rect width="1200" height="1140" fill="#e7dfe4"/><text x="70" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / ARTWORK PERSONALIZATION</text><text x="1130" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">08</text><path d="M70 99H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">A selected image. An explanation</text><text x="67" y="254" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">to question.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Keep the objective and its evidence separate.</text><text x="92" y="414" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Visible evidence</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >What the supplied artwork depicts</text><path d="M160 486H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Generated explanation</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >A learned response, not observed intent</text><path d="M160 599H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Preference supervision</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Chosen vs sampled alternative</text><path d="M160 712H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Evaluation boundary</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Offline IPS, not an online A/B test</text><path d="M160 825H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">08 / WHAT TO REMEMBER</text><text x="1130" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>