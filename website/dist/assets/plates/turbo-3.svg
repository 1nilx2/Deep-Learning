<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">TurboQuant KV Cache — Memory saved. More time to prefill.</title><desc id="desc">The result is a local memory–latency–retrieval trade-off, not a universal quality guarantee.</desc><rect width="1200" height="1140" fill="#dfe5eb"/><text x="70" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / TURBOQUANT KV CACHE</text><text x="1130" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">04</text><path d="M70 99H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Memory saved. More time to</text><text x="67" y="254" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">prefill.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Read retrieval and latency together.</text><text x="92" y="470" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">37.74 s</text><text x="92" y="525" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >FP16 prefill</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >30.3k · median across two prompts</text><path d="M92 610H572" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">73.09 s</text><text x="653" y="525" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Experimental prefill</text><text x="653" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >30.3k · median across two prompts</text><path d="M653 610H1133" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="92" y="733" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">2 / 2</text><text x="92" y="788" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >FP16 first code correct</text><text x="92" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Synthetic retrieval cases</text><path d="M92 873H572" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="653" y="733" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">1 / 2</text><text x="653" y="788" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Experimental first code correct</text><text x="653" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Too few cases for a general rate</text><path d="M653 873H1133" stroke="#4d637b" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">04 / THE TRADE-OFF</text><text x="1130" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>