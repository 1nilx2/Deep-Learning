<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">EmbeddingGemma 2 — Keep the result. Keep the uncertainty.</title><desc id="desc">The original notes, result distributions, and projection figures remain available in the report.</desc><rect width="1200" height="1140" fill="#dde7e0"/><text x="70" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / EMBEDDINGGEMMA 2</text><text x="1130" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">05</text><path d="M70 99H1130" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Keep the result. Keep the</text><text x="67" y="254" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">uncertainty.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >What this experiment actually supports.</text><text x="92" y="414" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Observed</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Cross-modal retrieval works here</text><path d="M160 486H1100" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Also observed</text><text x="160" y="573" fill="#6e6670" font-family="In