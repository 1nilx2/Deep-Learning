<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GenRec — The right item. The right training weight.</title><desc id="desc">This is a single-target weighted-CE illustration. Reward-to-weight mapping, normalization, and production hyperparameters are unspecified.</desc><rect width="1200" height="1140" fill="#e5e1d6"/><text x="70" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GENREC</text><text x="1130" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">05</text><path d="M70 99H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">The right item. The right</text><text x="67" y="254" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">training weight.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Scale the example, not the serving score.</text><text x="92" y="470" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">0.30</text><text x="92" y="525" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Illustrative target probability</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Target = item B</text><path d="M92 610H572" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">1.204</text><text x="653" y="525" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size=