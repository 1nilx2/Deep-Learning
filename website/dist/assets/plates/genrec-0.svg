<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GenRec — Which title comes next?</title><desc id="desc">The diagram follows the existing reading notes. It is an explanatory map, not a production trace.</desc><rect width="1200" height="1140" fill="#e5e1d6"/><text x="70" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GENREC</text><text x="1130" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">01</text><path d="M70 99H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Which title comes next?</text><text x="72" y="249" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >A ranking task, in context.</text><text x="92" y="414" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Read the context</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >History + metadata + request → x</text><path d="M160 486H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Encode once</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >LLM → context-dependent h</text><path d="M160 599H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Score the catalog</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Learned item vectors eᵢ + head φ</text><path d="M160 712H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Return the order</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Sort item scores at serving time</text><path d="M160 825H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">01 / THE QUESTION</text><text x="1130" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>