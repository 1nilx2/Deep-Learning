<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">TurboQuant KV Cache — Estimate storage. Do not invent a run.</title><desc id="desc">The estimate says nothing about one-million-token accuracy, prefill time, temporary memory, or total Metal allocation.</desc><rect width="1200" height="1140" fill="#dfe5eb"/><text x="70" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / TURBOQUANT KV CACHE</text><text x="1130" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">05</text><path d="M70 99H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Estimate storage. Do not invent</text><text x="67" y="254" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">a run.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >One million allocated tokens is arithmetic.</text><text x="92" y="470" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">26.7 GiB</text><text x="92" y="525" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >FP16 KV projection</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >One million allocated tokens</text><path d="M92 610H572" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">10.6 GiB</text><text x="653" y="525" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Experimental KV projection</text><text x="653" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Same architecture and format</text><path d="M653 610H1133" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="92" y="733" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">32,768</text><text x="92" y="788" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Native position limit</text><text x="92" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >This model cannot run 1M context</text><path d="M92 873H572" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="653" y="733" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">Estimate</text><text x="653" y="788" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Storage arithmetic only</text><text x="653" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Not a one-million-token benchmark</text><path d="M653 873H1133" stroke="#4d637b" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">05 / PROJECTION</text><text x="1130" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>