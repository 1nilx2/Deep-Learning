<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GR2 — Identify each item. Preserve its meaning.</title><desc id="desc">The name, ID, and BPE comparison explains the reading map; it is not a direct three-way experiment reported in the paper. Products, code assignments, and capacity counts are illustrative. A large code space does not guarantee collision-free SIDs.</desc><rect width="1200" height="1140" fill="#dfe6db"/><text x="70" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GR2</text><text x="1130" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">02</text><path d="M70 99H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Identify each item.</text><text x="67" y="254" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Preserve its meaning.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Names → IDs → token fragments. Why move to Semantic IDs?</text><text x="78" y="366" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" >01</text><text x="137" y="366" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500">Use product names alone?</text><text x="137" y="407" fill="#626c60" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >“Shampoo” does not identify one particular product.</text><path d="M137 428H1120" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="78" y="466" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" >02</text><text x="137" y="466" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500">Register every item ID as a new token?</text><text x="137" y="507" fill="#626c60" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Precise identity, but vocabulary grows with the catalog.</text><path d="M137 528H1120" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="78" y="566" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" >03</text><text x="137" y="566" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500">Split IDs with BPE?</text><text x="137" y="607" fill="#626c60" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Shared number fragments do not imply similar products.</text><path d="M137 628H1120" stroke="#536b50" stroke-opacity=".18" fill="none"/><rect x="70" y="662" width="1060" height="237" rx="4" fill="#536b50" fill-opacity=".09"/><text x="99" y="710" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" font-weight="500">SID: combine codes that reflect item meaning.</text><text x="105" y="762" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Shampoo A</text><text x="300" y="762" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" >[3, 7, 2]</text><text x="105" y="805" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Shampoo B</text><text x="300" y="805" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" >[3, 7, 9]</text><text x="667" y="765" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Share early codes</text><text x="667" y="805" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Distinguish by the full tuple</text><text x="103" y="869" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Think broad to fine, but learn the codes rather than hand-label them.</text><text x="78" y="947" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="33" >↓</text><text x="137" y="945" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" >Train on these SIDs together with product descriptions.</text><text x="137" y="986" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" >The LLM learns their relationships: tokenized mid-training.</text><path d="M70 1020H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">02 / TOKENIZED MID-TRAINING</text><text x="1130" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>