<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GenRec — Keep the signal. Spend fewer tokens.</title><desc id="desc">The controls use a fictional history and illustrative token counts. The reported 5,000 → 1,700 reduction is a separate paper result.</desc><rect width="1200" height="1140" fill="#e5e1d6"/><text x="70" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GENREC</text><text x="1130" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">03</text><path d="M70 99H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Keep the signal. Spend fewer</text><text x="67" y="254" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">tokens.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Selection is part of the model design.</text><text x="92" y="414" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Keep strong signals</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Long plays + explicit positive feedback</text><path d="M160 486H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Compress repetition</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Binge sessions + repeated activity</text><path d="M160 599H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Summarize older history</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Retain interests, reduce detail</text><path d="M160 712H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Reported context ablation</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >About 5,000 → 1,700 tokens</text><path d="M160 825H1100" stroke="#75674e" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">03 / CONTEXT ENGINEERING</text><text x="1130" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>