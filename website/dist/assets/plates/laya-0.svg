<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Laya vs CrossEncoder — Eight intents. One fixed test set.</title><desc id="desc">The benchmark does not establish performance across all 77 intents or on out-of-scope requests.</desc><rect width="1200" height="1140" fill="#e7e0d6"/><text x="70" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / LAYA VS CROSSENCODER</text><text x="1130" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">01</text><path d="M70 99H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Eight intents. One fixed test</text><text x="67" y="254" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">set.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >A BANKING77 subset, not the full task.</text><text x="92" y="470" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">8</text><text x="92" y="525" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Related payment intents</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >A BANKING77 subset</text><path d="M92 610H572" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">320</text><text x="653" y="525" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Held-out test requests</text><text x="653" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >40 official test requests per intent</text><path d="M653 610H1133" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="92" y="733" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">400</text><text x="92" y="788" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Allocated training requests</text><text x="92" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Laya retains 40 for calibration</text><path d="M92 873H572" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="653" y="733" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">CPU</text><text x="653" y="788" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Batch size four</text><text x="653" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Single local timing runs</text><path d="M653 873H1133" stroke="#785e49" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">01 / THE TASK</text><text x="1130" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>