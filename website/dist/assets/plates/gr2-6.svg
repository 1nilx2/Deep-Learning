<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GR2 — Keep the pipeline. Sharpen the details.</title><desc id="desc">Based on the supplied arXiv:2602.07774v6 and a personal handwritten reading map. Where Figure 1 and the explicit reward formulation differ in detail, these explorers follow Sections 4.2–4.3.</desc><rect width="1200" height="1140" fill="#dfe6db"/><text x="70" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GR2</text><text x="1130" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">07</text><path d="M70 99H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Keep the pipeline. Sharpen the</text><text x="67" y="254" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">details.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Connect the reading-map intuition to the paper’s definitions.</text><text x="92" y="418" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">KEEP THE INTUITION</text><rect x="92" y="460" width="505" height="84" rx="4" fill="#536b50" fill-opacity=".08"/><text x="114" y="513" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Item representation matters</text><rect x="92" y="565" width="505" height="84" rx="4" fill="#536b50" fill-opacity=".08"/><text x="114" y="618" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Select teacher traces</text><rect x="92" y="670" width="505" height="84" rx="4" fill="#536b50" fill-opacity=".08"/><text x="114" y="723" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Reward better rankings</text><text x="658" y="418" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">REFINE THE DETAILS</text><rect x="658" y="460" width="505" height="84" rx="4" fill="#536b50" fill-opacity=".08"/><text x="680" y="513" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >RQ-VAE, not BPE</text><rect x="658" y="565" width="505" height="84" rx="4" fill="#536b50" fill-opacity=".08"/><text x="680" y="618" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Assistant-token weighted NLL</text><rect x="658" y="670" width="505" height="84" rx="4" fill="#536b50" fill-opacity=".08"/><text x="680" y="723" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Rank lift, not an AUC reward</text><path d="M70 1020H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">07 / THE READING MAP</text><text x="1130" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>