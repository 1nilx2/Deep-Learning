<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">TurboQuant KV Cache — The cache is part of the total.</title><desc id="desc">The 60.2% cache reduction is not a 60.2% reduction in total memory.</desc><rect width="1200" height="1140" fill="#dfe5eb"/><text x="70" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / TURBOQUANT KV CACHE</text><text x="1130" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">03</text><path d="M70 99H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">The cache is part of the total.</text><text x="72" y="249" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Weights and compute buffers remain.</text><text x="92" y="470" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">1,801 MiB</text><text x="92" y="525" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Model allocation</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Same measured local runs</text><path d="M92 610H572" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">1,671 MiB</text><text x="653" y="525" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Compute buffers</text><text x="653" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Experimental format · 30.3k</text><path d="M653 610H1133" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="92" y="733" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">357 MiB</text><text x="92" y="788" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >KV allocation</text><text x="92" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Experimental format · 30.3k</text><path d="M92 873H572" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="653" y="733" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">3,829 MiB</text><text x="653" y="788" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Total Metal allocation</text><text x="653" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Weights + compute + KV</text><path d="M653 873H1133" stroke="#4d637b" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">03 / THE WHOLE PROCESS</text><text x="1130" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>