<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">EmbeddingGemma 2 — Retrieval can work. Separation can remain.</title><desc id="desc">The gap summarizes this dataset. UMAP is exploratory; it does not prove semantic equivalence.</desc><rect width="1200" height="1140" fill="#dde7e0"/><text x="70" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / EMBEDDINGGEMMA 2</text><text x="1130" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">03</text><path d="M70 99H1130" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Retrieval can work. Separation</text><text x="67" y="254" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">can remain.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >A shared task does not erase modality.</text><text x="92" y="470" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">0.810</text><text x="92" y="525" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Mean paired cosine similarity</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Original embedding space</text><path d="M92 610H572" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">0.720</text><text x="653" y="525" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Mean mismatched similarity</text><text x="653" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Exp 1 comparison</text><path d="M653 610H1133" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="92" y="733" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">0.090</text><text x="92" y="788" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Mean paired-minus-mismatched</text><text x="92" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Rounded reported difference</text><path d="M92 873H572" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="653" y="733" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">100%</text><text x="653" y="788" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Modality classification</text><text x="653" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Held-out children; Exp 1</text><path d="M653 873H1133" stroke="#42685f" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">03 / MODALITY SIGNATURE</text><text x="1130" y="1071" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>