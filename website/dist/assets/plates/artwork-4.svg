<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Artwork Personalization — Prefer one response over another.</title><desc id="desc">A sampled alternative is not an observed dislike. The loss demo shows log-ratio changes, not actual training or guarantees about each response’s absolute probability.</desc><rect width="1200" height="1140" fill="#e7dfe4"/><text x="70" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / ARTWORK PERSONALIZATION</text><text x="1130" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">05</text><path d="M70 99H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Prefer one response over</text><text x="67" y="254" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">another.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >A relative gap, against a frozen reference.</text><text x="92" y="418" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">CHOSEN RESPONSE</text><rect x="92" y="460" width="505" height="84" rx="4" fill="#795a70" fill-opacity=".08"/><text x="114" y="513" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Ground-truth artwork</text><rect x="92" y="565" width="505" height="84" rx="4" fill="#795a70" fill-opacity=".08"/><text x="114" y="618" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >log πθ(yw) / πref(yw)</text><rect x="92" y="670" width="505" height="84" rx="4" fill="#795a70" fill-opacity=".08"/><text x="114" y="723" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Reference stays frozen</text><text x="658" y="418" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">REJECTED RESPONSE</text><rect x="658" y="460" width="505" height="84" rx="4" fill="#795a70" fill-opacity=".08"/><text x="680" y="513" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Sampled alternative</text><rect x="658" y="565" width="505" height="84" rx="4" fill="#795a70" fill-opacity=".08"/><text x="680" y="618" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >log πθ(yl) / πref(yl)</text><rect x="658" y="670" width="505" height="84" rx="4" fill="#795a70" fill-opacity=".08"/><text x="680" y="723" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Not an observed dislike</text><path d="M70 1020H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">05 / DIRECT PREFERENCE OPTIMIZATION</text><text x="1130" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>