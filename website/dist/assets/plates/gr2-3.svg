<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GR2 — Reward the move. Not just the format.</title><desc id="desc">The explicit reward uses target-rank improvement and format checks, rather than a separately trained reward model or AUC/NDCG score. Format checks do not directly establish that the reasoning is true.</desc><rect width="1200" height="1140" fill="#dfe6db"/><text x="70" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GR2</text><text x="1130" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">04</text><path d="M70 99H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Reward the move. Not just the</text><text x="67" y="254" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">format.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Do not make copying the input order a shortcut to reward.</text><text x="92" y="414" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Rank reward</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Rrank = (rank before − rank after) / N</text><path d="M160 486H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Format reward</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Can reasoning + ranking be extracted?</text><path d="M160 599H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Conditional bonus</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Add αRfmt if improved OR initially #1</text><path d="M160 712H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Copying below #1</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >No improvement → no format bonus</text><path d="M160 825H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">04 / RL · REWARD DESIGN</text><text x="1130" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>