<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GenRec — Build a foundation. Refresh a ranker.</title><desc id="desc">The paper does not disclose a complete Phase-1 training recipe. This is not the artwork paper’s LoRA-SFT → DPO design.</desc><rect width="1200" height="1140" fill="#e5e1d6"/><text x="70" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GENREC</text><text x="1130" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">02</text><path d="M70 99H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Build a foundation. Refresh a</text><text x="67" y="254" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">ranker.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Reusable knowledge, timely preferences.</text><text x="92" y="418" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">PHASE 1 / FOUNDATION</text><rect x="92" y="460" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="114" y="513" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >User + content understanding</text><rect x="92" y="565" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="114" y="618" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Language + instructions</text><rect x="92" y="670" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="114" y="723" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Less frequent refresh</text><text x="658" y="418" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">PHASE 2 / RANKER</text><rect x="658" y="460" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="680" y="513" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Recommendation supervision</text><rect x="658" y="565" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="680" y="618" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Backbone + head + items</text><rect x="658" y="670" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="680" y="723" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >More frequent refresh</text><path d="M70 1020H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">02 / TWO TRAINING PHASES</text><text x="1130" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>