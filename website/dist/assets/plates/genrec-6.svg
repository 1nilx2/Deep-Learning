<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GenRec — A gain needs a comparison base.</title><desc id="desc">Do not add ablation improvements to the production comparison or interpret relative changes as percentage-point gains.</desc><rect width="1200" height="1140" fill="#e5e1d6"/><text x="70" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GENREC</text><text x="1130" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">07</text><path d="M70 99H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">A gain needs a comparison base.</text><text x="72" y="249" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Different experiments, different denominators.</text><text x="92" y="470" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">+1.6%</text><text x="92" y="525" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Relative offline MRR</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Versus production ranker</text><path d="M92 610H572" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">40×</text><text x="653" y="525" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Fewer Phase-2 examples</text><text x="653" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Excludes pretraining + Phase 1</text><path d="M653 610H1133" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="92" y="733" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">+0.115%</text><text x="92" y="788" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Homepage engagement</text><text x="92" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Reported treatment vs production</text><path d="M92 873H572" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="653" y="733" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">~⅓</text><text x="653" y="788" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Compressed-context cost</text><text x="653" y="833" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Versus original context, not ranker</text><path d="M653 873H1133" stroke="#75674e" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">07 / READ THE COMPARISON</text><text x="1130" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>