<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Laya vs CrossEncoder — Count the correct decisions.</title><desc id="desc">One test split is not a reliable universal ranking of these systems.</desc><rect width="1200" height="1140" fill="#e7e0d6"/><text x="70" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / LAYA VS CROSSENCODER</text><text x="1130" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">03</text><path d="M70 99H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Count the correct decisions.</text><text x="72" y="249" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >From 248 to 290 correct Laya predictions.</text><text x="92" y="430" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Laya · original</text><rect x="92" y="454" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="454" width="781.2" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="539" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">77.5 % accuracy</text><text x="92" y="567" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Laya · fine-tuned</text><rect x="92" y="591" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="591" width="913.2479999999999" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="676" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">90.6 % accuracy</text><text x="92" y="704" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >CrossEncoder · base</text><rect x="92" y="728" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="728" width="904.176" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="813" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">89.7 % accuracy</text><text x="92" y="841" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >CrossEncoder · large</text><rect x="92" y="865" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="865" width="941.4720000000001" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="950" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">93.4 % accuracy</text><path d="M70 1020H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">03 / MEASURED QUALITY</text><text x="1130" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>