<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">EmbeddingGemma 2 — Can a voice find its words?</title><desc id="desc">Exp 1 only. Three pairs were checked directly; the remaining 218 were assumed aligned.</desc><rect width="1200" height="1140" fill="#dde7e0"/><text x="70" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / EMBEDDINGGEMMA 2</text><text x="1130" y="71" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">01</text><path d="M70 99H1130" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Can a voice find its words?</text><text x="72" y="249" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Paired dialogue, across modalities.</text><text x="92" y="470" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">221</text><text x="92" y="525" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Paired dialogues</text><text x="92" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Six children</text><path d="M92 610H572" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="653" y="470" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="75" letter-spacing="-3">72.4%</text><text x="653" y="525" fill="#42685f" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Text → audio Top-1</text><text x="653" y="570" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" >Exp 1</text><path d="M653 610H1133" stroke="#42685f" stroke-opacity=".18" fill="none"/><text x="92