<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Laya vs CrossEncoder — An option question. Eight pair scores.</title><desc id="desc">Do not attribute the entire accuracy difference to architecture.</desc><rect width="1200" height="1140" fill="#e7e0d6"/><text x="70" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / LAYA VS CROSSENCODER</text><text x="1130" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">02</text><path d="M70 99H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">An option question. Eight pair</text><text x="67" y="254" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">scores.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Read the unit of computation.</text><text x="92" y="418" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">LAYA</text><rect x="92" y="460" width="505" height="84" rx="4" fill="#785e49" fill-opacity=".08"/><text x="114" y="513" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >One request</text><rect x="92" y="565" width="505" height="84" rx="4" fill="#785e49" fill-opacity=".08"/><text x="114" y="618" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >One eight-option question</text><rect x="92" y="670" width="505" height="84" rx="4" fill="#785e49" fill-opacity=".08"/><text x="114" y="723" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Option probabilities</text><text x="658" y="418" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">CROSSENCODER</text><rect x="658" y="460" width="505" height="84" rx="4" fill="#785e49" fill-opacity=".08"/><text x="680" y="513" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >One request</text><rect x="658" y="565" width="505" height="84" rx="4" fill="#785e49" fill-opacity=".08"/><text x="680" y="618" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Eight request–option pairs</text><rect x="658" y="670" width="505" height="84" rx="4" fill="#785e49" fill-opacity=".08"/><text x="680" y="723" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Pair scores → decision</text><path d="M70 1020H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">02 / SYSTEMS</text><text x="1130" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>