<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Artwork Personalization — Generate a caption. Match a candidate.</title><desc id="desc">This teaching matcher is not the paper’s exact decoding implementation. Real generation and matching can have ambiguities that the examples do not cover.</desc><rect width="1200" height="1140" fill="#e7dfe4"/><text x="70" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / ARTWORK PERSONALIZATION</text><text x="1130" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">06</text><path d="M70 99H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Generate a caption. Match a</text><text x="67" y="254" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">candidate.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Text output becomes an artwork selection.</text><text x="92" y="414" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Model output</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Generated caption text</text><path d="M160 486H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Candidate comparison</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Match output to supplied captions</text><path d="M160 599H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Illustrative matcher</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Shared word bigrams</text><path d="M160 712H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Ambiguous or no overlap</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >No unique match in the teaching demo</text><path d="M160 825H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">06 / INFERENCE</text><text x="1130" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>