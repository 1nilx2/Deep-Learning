<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Laya vs CrossEncoder — A percentage is not the whole comparison.</title><desc id="desc">All timings are single local CPU runs with batch size four, not hardware-independent throughput claims.</desc><rect width="1200" height="1140" fill="#e7e0d6"/><text x="70" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / LAYA VS CROSSENCODER</text><text x="1130" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">04</text><path d="M70 99H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">A percentage is not the whole</text><text x="67" y="254" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">comparison.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Probability quality and CPU time also matter.</text><text x="92" y="430" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Laya · original</text><rect x="92" y="454" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="454" width="397.55519999999996" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="539" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">98.6 ms / request</text><text x="92" y="567" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Laya · fine-tuned</text><rect x="92" y="591" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="591" width="398.36159999999995" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="676" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">98.8 ms / request</text><text x="92" y="704" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >CrossEncoder · base</text><rect x="92" y="728" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="728" width="307.6416" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="813" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">76.3 ms / request</text><text x="92" y="841" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >CrossEncoder · large</text><rect x="92" y="865" width="1008" height="45" rx="4" fill="#785e49" fill-opacity=".1"/><rect x="92" y="865" width="838.656" height="45" rx="4" fill="#785e49" fill-opacity=".55"/><text x="1100" y="950" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">208 ms / request</text><path d="M70 1020H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">04 / LATENCY &amp; CALIBRATION</text><text x="1130" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>