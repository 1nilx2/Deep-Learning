<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Artwork Personalization — A better signal for a better choice.</title><desc id="desc">The notes use the IPS improvements shared by Tables 1 and 4; DPO accuracy values differ between those tables.</desc><rect width="1200" height="1140" fill="#e7dfe4"/><text x="70" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / ARTWORK PERSONALIZATION</text><text x="1130" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">07</text><path d="M70 99H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">A better signal for a better</text><text x="67" y="254" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">choice.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Reasoning-SFT leads the reported comparison.</text><text x="92" y="430" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >SFT</text><rect x="92" y="454" width="1008" height="45" rx="4" fill="#795a70" fill-opacity=".1"/><rect x="92" y="454" width="411.6000000000001" height="45" rx="4" fill="#795a70" fill-opacity=".55"/><text x="1100" y="539" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="end">2.45 % relative IPS</text><text x="92" y="567" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >DPO</text><rect x="92" y="591" width="1008" height="45" rx="4" fill="#795a70" fill-opacity=".1"/><rect x="92" y="591" width="473.76" height="45" rx="4" fill="#795a70