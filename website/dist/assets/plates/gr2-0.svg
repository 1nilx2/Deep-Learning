<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GR2 — A fixed list. A better order.</title><desc id="desc">The observed next purchase supplies the training label and evaluation signal. The future answer is not provided as a serving-time input.</desc><rect width="1200" height="1140" fill="#dfe6db"/><text x="70" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GR2</text><text x="1130" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">01</text><path d="M70 99H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">A fixed list. A better order.</text><text x="72" y="249" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >The candidates are selected. In what order should they appear?</text><text x="92" y="414" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Represent the items</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Text → RQ-VAE → Semantic IDs</text><path d="M160 486H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Align the language</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >SID + natural language → mid-training</text><path d="M160 599H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Distill the reasoning</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Teacher → accepted traces → weighted SFT</text><path d="M160 712H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Optimize the order</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Conditional rewards → DAPO</text><path d="M160 825H1100" stroke="#536b50" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">01 / THE QUESTION</text><text x="1130" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>