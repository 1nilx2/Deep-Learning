<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Laya vs CrossEncoder — Compare systems. Avoid a causal shortcut.</title><desc id="desc">A controlled architecture ablation would need matched initialization, training, and evaluation conditions.</desc><rect width="1200" height="1140" fill="#e7e0d6"/><text x="70" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / LAYA VS CROSSENCODER</text><text x="1130" y="71" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">05</text><path d="M70 99H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Compare systems. Avoid a causal</text><text x="67" y="254" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">shortcut.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >The training protocols are not identical.</text><text x="92" y="414" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Gradient-training items</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Laya 360; CrossEncoder 400</text><path d="M160 486H1100" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Calibration</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Held-back items vs validation logits</text><path d="M160 599H1100" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Initialization + objectives</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Not a controlled architecture ablation</text><path d="M160 712H1100" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Conclusion</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >A system comparison with limits</text><path d="M160 825H1100" stroke="#785e49" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#785e49" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">05 / LIMITS</text><text x="1130" y="1071" fill="#785e49" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>