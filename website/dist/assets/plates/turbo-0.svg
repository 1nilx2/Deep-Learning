<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">TurboQuant KV Cache — Quantize the cache. Measure the process.</title><desc id="desc">The source report records configured capacity separately from input-token count.</desc><rect width="1200" height="1140" fill="#dfe5eb"/><text x="70" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / TURBOQUANT KV CACHE</text><text x="1130" y="71" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">01</text><path d="M70 99H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Quantize the cache. Measure the</text><text x="67" y="254" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">process.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Q8 keys and TurboQuant 4-bit values.</text><text x="92" y="418" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">BASELINE</text><rect x="92" y="460" width="505" height="84" rx="4" fill="#4d637b" fill-opacity=".08"/><text x="114" y="513" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >FP16 keys</text><rect x="92" y="565" width="505" height="84" rx="4" fill="#4d637b" fill-opacity=".08"/><text x="114" y="618" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >FP16 values</text><rect x="92" y="670" width="505" height="84" rx="4" fill="#4d637b" fill-opacity=".08"/><text x="114" y="723" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Qwen2.5-1.5B · M1 Max</text><text x="658" y="418" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">EXPERIMENT</text><rect x="658" y="460" width="505" height="84" rx="4" fill="#4d637b" fill-opacity=".08"/><text x="680" y="513" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Q8_0 keys</text><rect x="658" y="565" width="505" height="84" rx="4" fill="#4d637b" fill-opacity=".08"/><text x="680" y="618" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >TurboQuant 4-bit values</text><rect x="658" y="670" width="505" height="84" rx="4" fill="#4d637b" fill-opacity=".08"/><text x="680" y="723" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Same local model and device</text><path d="M70 1020H1130" stroke="#4d637b" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">01 / THE SETUP</text><text x="1130" y="1071" fill="#4d637b" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>