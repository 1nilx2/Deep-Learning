<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GR2 — Distill the reasoning. Keep correct predictions.</title><desc id="desc">In rejection sampling, the ground truth is used for external verification, not as a teacher input. A correct prediction does not guarantee a factual explanation. The potential cost advantage of targeted sampling follows from fewer retries; it is not a measured cost reduction reported here.</desc><rect width="1200" height="1140" fill="#dfe6db"/><text x="70" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GR2</text><text x="1130" y="71" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">03</text><path d="M70 99H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Distill the reasoning.</text><text x="67" y="254" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">Keep correct predictions.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Distillation: teacher generation → verification → selection → student SFT</text><defs><marker id="trace-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536b50" stroke-width="1.2"/></marker></defs><text x="72" y="353" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >REJECTION SAMPLING · PREDICT FIRST, THEN CHECK</text><rect x="70" y="379" width="460" height="88" rx="4" fill="#536b50" fill-opacity=".07"/><text x="94" y="414" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" >History + candidates</text><text x="94" y="449" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Ground truth withheld</text><path d="M545 423H632" fill="none" stroke="#536b50" stroke-width="2" stroke-opacity=".55" marker-end="url(#trace-arrow)"/><rect x="650" y="379" width="480" height="88" rx="4" fill="#536b50" fill-opacity=".1"/><text x="677" y="414" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" >Teacher generates</text><text x="677" y="449" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Reasoning + predicted ranking</text><path d="M890 470V492H600V516" fill="none" stroke="#536b50" stroke-width="2" stroke-opacity=".55" marker-end="url(#trace-arrow)"/><rect x="300" y="523" width="600" height="62" rx="4" fill="#536b50" fill-opacity=".12"/><text x="600" y="564" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="31" text-anchor="middle">Predicted item = ground truth?</text><path d="M300 554H278V612" fill="none" stroke="#536b50" stroke-width="2" stroke-opacity=".55" marker-end="url(#trace-arrow)"/><path d="M900 554H910V612" fill="none" stroke="#536b50" stroke-width="2" stroke-opacity=".55" marker-end="url(#trace-arrow)"/><rect x="70" y="623" width="460" height="85" rx="4" fill="#536b50" fill-opacity=".05"/><text x="94" y="658" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="29" >Wrong → discard and retry</text><text x="94" y="691" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Do not train on this response.</text><rect x="650" y="623" width="480" height="85" rx="4" fill="#536b50" fill-opacity=".17"/><text x="674" y="658" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="29" >Correct → retain for training</text><text x="674" y="691" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Reasoning + ranking → student SFT</text><text x="73" y="747" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Use ground truth only to check the generated prediction externally.</text><rect x="70" y="781" width="1060" height="203" rx="4" fill="#536b50" fill-opacity=".06"/><text x="97" y="825" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="500">ALTERNATIVE · TARGETED SAMPLING</text><text x="97" y="868" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Give the answer first → generate a rationale for it.</text><text x="97" y="918" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >Fewer retries may reduce cost,</text><text x="97" y="955" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" >but label-driven rationalization can hallucinate evidence.</text><path d="M70 1020H1130" stroke="#536b50" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">03 / REASONING DATA + SFT</text><text x="1130" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>