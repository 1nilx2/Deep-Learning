<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GenRec — One context vector. A score for every item.</title><desc id="desc">The exact pooling position and scoring function φ are not disclosed. The editable logits explain softmax; they do not assume φ is a dot product.</desc><rect width="1200" height="1140" fill="#e5e1d6"/><text x="70" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GENREC</text><text x="1130" y="71" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">04</text><path d="M70 99H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">One context vector. A score for</text><text x="67" y="254" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">every item.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >h meets the learned item vectors.</text><text x="92" y="418" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">CONTEXT SIDE</text><rect x="92" y="460" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="114" y="513" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Verbalized input x</text><rect x="92" y="565" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="114" y="618" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Backbone forward pass</text><rect x="92" y="670" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="114" y="723" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Context activation h</text><text x="658" y="418" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="25" letter-spacing="2">CATALOG SIDE</text><rect x="658" y="460" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="680" y="513" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Learned parameters eᵢ</text><rect x="658" y="565" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="680" y="618" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Catalog-aware φ(h, eᵢ)</text><rect x="658" y="670" width="505" height="84" rx="4" fill="#75674e" fill-opacity=".08"/><text x="680" y="723" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="27" >Logits → probabilities</text><path d="M70 1020H1130" stroke="#75674e" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">04 / CATALOG-AWARE SCORING</text><text x="1130" y="1071" fill="#75674e" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>