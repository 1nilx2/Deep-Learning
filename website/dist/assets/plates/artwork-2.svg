<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Artwork Personalization — History. Title. Candidate captions.</title><desc id="desc">This prompt is illustrative, not an undisclosed production template. Label-conditioned explanations do not reveal a viewer’s actual internal reasons.</desc><rect width="1200" height="1140" fill="#e7dfe4"/><text x="70" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / ARTWORK PERSONALIZATION</text><text x="1130" y="71" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">03</text><path d="M70 99H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="67" y="184" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">History. Title. Candidate</text><text x="67" y="254" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="500" letter-spacing="-2">captions.</text><text x="72" y="308" fill="#716874" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >One prompt connects the evidence.</text><text x="92" y="414" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >01</text><text x="160" y="414" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Viewing history</text><text x="160" y="460" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Preference evidence from past activity</text><path d="M160 486H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="527" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >02</text><text x="160" y="527" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Target title</text><text x="160" y="573" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >The selected title and its context</text><path d="M160 599H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="640" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >03</text><text x="160" y="640" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Candidate captions</text><text x="160" y="686" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Visual cues converted to text</text><path d="M160 712H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="92" y="753" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >04</text><text x="160" y="753" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="35" >Selection instruction</text><text x="160" y="799" fill="#6e6670" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="24" >Return the chosen artwork caption</text><path d="M160 825H1100" stroke="#795a70" stroke-opacity=".18" fill="none"/><path d="M70 1020H1130" stroke="#795a70" stroke-opacity=".18" fill="none"/><text x="72" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.3">03 / THE SHARED INPUT</text><text x="1130" y="1071" fill="#795a70" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>