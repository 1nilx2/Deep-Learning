<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">GR2: learn the items, distill reasoning, reward the ranking</title><desc id="desc">Authored schematic of the paper training pipeline. SID alignment, teacher traces and weighted SFT lead to DAPO with conditional rank rewards. The rank change 6 to 2 is an illustrative example, not a measured result.</desc><rect width="1200" height="1140" fill="#dfe6db"/><text x="70" y="72" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5">FIELDNOTES / GENERATIVE REASONING</text><text x="1130" y="72" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" text-anchor="end">07</text><path d="M70 99H1130" stroke="#536b50" stroke-opacity=".2"/><text x="65" y="201" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="86" letter-spacing="-4">GR2</text><text x="70" y="255" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" >Learn the items. Distill the reasoning. Reward the ranking.</text><text x="72" y="372" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" >01</text><text x="141" y="369" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="1.5">TOKENIZED MID-TRAINING</text><rect x="141" y="391" width="438" height="80" rx="5" fill="#536b50" fill-opacity=".08" stroke="#536b50" stroke-opacity=".2"/><rect x="605" y="391" width="495" height="80" rx="5" fill="#536b50" fill-opacity=".08" stroke="#536b50" stroke-opacity=".2"/><text x="160" y="439" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Item text → RQ-VAE → SID</text><text x="625" y="439" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >SID + language → student</text><text x="72" y="550" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" >02</text><text x="141" y="547" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="1.5">REASONING DISTILLATION</text><rect x="141" y="569" width="438" height="80" rx="5" fill="#536b50" fill-opacity=".08" stroke="#536b50" stroke-opacity=".2"/><rect x="605" y="569" width="495" height="80" rx="5" fill="#536b50" fill-opacity=".08" stroke="#536b50" stroke-opacity=".2"/><text x="160" y="617" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Teacher → predict → verify</text><text x="625" y="617" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Accepted traces → weighted SFT</text><text x="72" y="728" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" >03</text><text x="141" y="725" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="22" letter-spacing="1.5">REWARD-DRIVEN LEARNING</text><rect x="141" y="747" width="438" height="80" rx="5" fill="#536b50" fill-opacity=".08" stroke="#536b50" stroke-opacity=".2"/><rect x="605" y="747" width="495" height="80" rx="5" fill="#536b50" fill-opacity=".08" stroke="#536b50" stroke-opacity=".2"/><text x="160" y="795" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Several student rollouts</text><text x="625" y="795" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="23" >Rank + conditional format → DAPO</text><text x="72" y="934" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="56" >6 → 2</text><text x="300" y="924" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="30" >Rrank = (6 − 2) / 10 = 0.4</text><text x="300" y="963" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="1">ILLUSTRATIVE · FORMAT BONUS ONLY UNDER EQ. 15</text><path d="M70 1020H1130" stroke="#536b50" stroke-opacity=".2"/><text x="72" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="20" letter-spacing="1.5">SID → REASONING → SFT → DAPO</text><text x="1130" y="1071" fill="#536b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="26" text-anchor="end">↗</text></svg>